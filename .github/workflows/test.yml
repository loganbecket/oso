name: Test

# Every push gets a quick check on Linux (about a minute), and warms the Windows and macOS download caches
# so release checks start with Oso's packages and the search model already in hand. The full check on
# Windows, macOS, and Linux (LibreOffice on Linux, the real search model, text recognition, and a live
# Windows update) runs on release tags, and on demand from the Actions tab. When it passes on a tag, the
# GitHub release is published from the tag's message.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  quick:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Run tests
        run: uv run --locked --python 3.12 --extra dev pytest -q -x

  warm:
    # Caches made on master are the ones release tags can use.
    if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/oso-models
          key: search-model-${{ runner.os }}-bge-small-en-v1.5
      - name: Download Oso's packages and the search model
        shell: bash
        run: |
          uv sync --locked --python 3.12 --extra dev
          uv run --locked --python 3.12 python -c "from fastembed import TextEmbedding; import os; TextEmbedding('BAAI/bge-small-en-v1.5', cache_dir=os.path.expanduser('~/oso-models'))"
      - name: Install the way students do and start it
        run: uvx --python 3.12 --from . oso --help

  test:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/oso-models
          key: search-model-${{ runner.os }}-bge-small-en-v1.5

      # LibreOffice only on Linux: a few document-conversion tests use it, and installing it on Windows and
      # macOS cost over a minute each.
      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Run tests
        if: runner.os != 'Linux'
        shell: bash
        env:
          OSO_REAL_SEARCH_MODEL: "1"
        run: OSO_MODEL_CACHE=~/oso-models uv run --locked --python 3.12 --extra dev pytest -q -rs

      - name: Run tests (Linux, with a virtual display for the quiz window)
        if: runner.os == 'Linux'
        env:
          OSO_REAL_SEARCH_MODEL: "1"
        run: OSO_MODEL_CACHE=~/oso-models xvfb-run -a uv run --locked --python 3.12 --extra dev pytest -q -rs

      - name: Install the way students do and start it
        run: uvx --python 3.12 --from . oso --help

      - name: Update in place while Oso is running (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv tool install --python 3.12 .
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          New-Item -ItemType Directory "$env:RUNNER_TEMP\vault" | Out-Null
          oso init --vault "$env:RUNNER_TEMP\vault" --timezone America/New_York --canvas-feed-url ""
          # Hold Oso's files open the way the Claude app's copy does.
          $py = Join-Path (uv tool dir) "oso\Scripts\python.exe"
          $held = Start-Process $py -ArgumentList '-c', 'import time; time.sleep(900)' -PassThru -WindowStyle Hidden
          oso update --version ${{ github.sha }}
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 5
            $log = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter update.log -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($log -and (Select-String -Path $log.FullName -Pattern 'Update (finished|failed)' -Quiet)) { break }
          }
          Get-Content $log.FullName
          if (-not (Select-String -Path $log.FullName -Pattern 'Update finished' -Quiet)) { exit 1 }
          if (-not $held.HasExited) { Write-Host "the held process was not stopped"; exit 1 }
          oso --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = oso install-task
          Write-Host $out
          if ($out -notmatch "^Installed") { exit 1 }

      - name: Report text recognition on this machine
        if: runner.os != 'Linux'
        shell: bash
        run: |
          uv run --locked --python 3.12 python - <<'PY'
          import tempfile
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from oso import ocr
          img = Image.new("RGB", (1400, 300), "white")
          ImageDraw.Draw(img).text((40, 100), "Velocity and acceleration", fill="black", font=ImageFont.load_default(size=72))
          p = Path(tempfile.mkdtemp()) / "page.png"
          img.save(p)
          try:
              text = ocr.read_image(p)
              print("::notice title=Text recognition::read " + repr(text.strip())[:120])
          except Exception as e:
              print("::warning title=Text recognition::" + str(e)[:300])
          PY

  release:
    # Publish the release once every system passed, with the tag's message as its notes.
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents:body)' > notes.md
          if [ ! -s notes.md ]; then git for-each-ref "refs/tags/$TAG" --format='%(contents)' > notes.md; fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --latest
