[project]
name = "oso"
version = "0.1.0"
description = "Study assistant service: connectors, deadline database, and vault writer"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "icalendar>=6.0",
    "requests>=2.32",
    "keyring>=25.0",
    "platformdirs>=4.0",
    "mcp>=1.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pypdf>=6.19.0",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.3",
    "pillow>=12.3.0",
]

[project.scripts]
oso = "oso.cli:main"
oso-mcp = "oso.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["service/oso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["service"]
