name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Install LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice

      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh -y --no-progress

      - name: Run tests
        run: uv run --python 3.12 --extra dev pytest -q

      - name: Install the way students do and start it
        run: uvx --python 3.12 --from . oso --help

      - name: Update in place while Oso is running (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv tool install --python 3.12 .
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          New-Item -ItemType Directory "$env:RUNNER_TEMP\vault" | Out-Null
          oso init --vault "$env:RUNNER_TEMP\vault" --timezone America/New_York --canvas-feed-url ""
          # Hold Oso's files open the way the Claude app's copy does.
          $py = Join-Path (uv tool dir) "oso\Scripts\python.exe"
          $held = Start-Process $py -ArgumentList '-c', 'import time; time.sleep(900)' -PassThru -WindowStyle Hidden
          oso update --version ${{ github.sha }}
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 5
            $log = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter update.log -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($log -and (Select-String -Path $log.FullName -Pattern 'Update (finished|failed)' -Quiet)) { break }
          }
          Get-Content $log.FullName
          if (-not (Select-String -Path $log.FullName -Pattern 'Update finished' -Quiet)) { exit 1 }
          if (-not $held.HasExited) { Write-Host "the held process was not stopped"; exit 1 }
          oso --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
