[project]
name = "oso"
version = "0.18.6"
description = "Study assistant service: connectors, deadline database, and vault writer"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "icalendar>=6.0",
    "requests>=2.32",
    "keyring>=25.0",
    "platformdirs>=4.0",
    "mcp>=2.0",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.3",
    "pillow>=12.3.0",
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.8",
    "google-auth>=2.59.1",
    "google-auth-oauthlib>=1.5.0",
    "fastembed>=0.8",
    "pywebview>=5.0",
    "watchdog>=4.0",
    "winotify>=1.1; sys_platform == 'win32'",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
oso = "oso.cli:main"
oso-mcp = "oso.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "python-docx>=1.2.0", "openpyxl>=3.1.5", "python-pptx>=1.0.2", "pypdf>=6.19.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["service/oso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["service"]
